<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ closeModal }}" style="position:fixed;inset:0;z-index:50;background:rgba(6,7,7,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;overflow:auto;overscroll-behavior:contain" class="g-scroll">
  <div onClick="{{ stop }}" ref="{{ dialogRef }}" role="dialog" aria-modal="true" aria-label="{{ modalTitleText }}" style="width:560px;max-width:100%;background:var(--card,#141614);border:1px solid var(--wg);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:gpop .2s ease">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--wd)">
      <span style="font-size:16px;font-weight:700">{{ modalTitleText }}</span>
      <button onClick="{{ closeModal }}" aria-label="Close dialog" style="color:var(--muted,#8b938d);background:none;border:none;padding:0 4px;cursor:pointer;font-size:20px;line-height:1">×</button>
    </div>
    <div style="padding:22px 24px;display:flex;flex-direction:column;gap:17px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
        <div style="display:grid;grid-template-rows:{{ g.gridRows }};opacity:{{ g.opacity }};margin-top:{{ g.slideMargin }};transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1),opacity .28s ease,margin-top .32s cubic-bezier(.4,0,.2,1)">
          <div style="overflow:{{ g.overflow }};min-height:0">
            <div style="display:grid;grid-template-columns:{{ g.colsStyle }};gap:14px">
              <sc-for list="{{ g.fields }}" as="f" hint-placeholder-count="1">
            <div>
              <sc-if value="{{ f.isInput }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b938d);font-weight:600;margin-bottom:7px">{{ f.label }}</div>
                <sc-if value="{{ f.isTextInput }}" hint-placeholder-val="{{ true }}">
                  <sc-if value="{{ f.hasLookup }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;gap:8px;align-items:center">
                      <input value="{{ f.value }}" onInput="{{ f.onInput }}" type="{{ f.inputType }}" aria-label="{{ f.label }}" autocomplete="off" spellcheck="false" placeholder="{{ f.placeholder }}" style="flex:1;min-width:0;background:var(--inset,#0f110f);border:1px solid var(--wh);border-radius:9px;padding:10px 12px;color:var(--text,#e8ebe8);font-size:14px;font-family:{{ f.fontFamily }}"/>
                      <button onClick="{{ f.onLookup }}" style="flex:none;font-size:12px;font-weight:600;white-space:nowrap;color:var(--accent,#d8b98f);background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);border-radius:9px;padding:10px 14px;cursor:pointer;opacity:{{ f.lookupOpacity }}">{{ f.lookupBtnLabel }}</button>
                    </div>
                    <sc-if value="{{ f.lookupMsg }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;line-height:1.4;color:{{ f.lookupMsgColor }};margin-top:6px">{{ f.lookupMsg }} <sc-if value="{{ f.lookupErr }}" hint-placeholder-val="{{ false }}"><a href="{{ f.lookupSearchUrl }}" target="_blank" rel="noopener" style="color:var(--accent,#d8b98f);text-decoration:underline">Search the web ↗</a></sc-if></div></sc-if>
                  </sc-if>
                  <sc-if value="{{ f.noLookup }}" hint-placeholder-val="{{ true }}">
                    <input value="{{ f.value }}" onInput="{{ f.onInput }}" type="{{ f.inputType }}" aria-label="{{ f.label }}" autocomplete="off" min="{{ f.min }}" max="{{ f.max }}" step="{{ f.step }}" placeholder="{{ f.placeholder }}" style="width:100%;background:var(--inset,#0f110f);border:1px solid var(--wh);border-radius:9px;padding:10px 12px;color:var(--text,#e8ebe8);font-size:14px;font-family:{{ f.fontFamily }}"/>
                  </sc-if>
                </sc-if>
                <sc-if value="{{ f.isDate }}" hint-placeholder-val="{{ false }}">
                  <dc-import name="DatePicker" value="{{ f.value }}" placeholder="{{ f.placeholder }}" onChange="{{ f.onDate }}" hint-size="100%,44px"></dc-import>
                </sc-if>
                <sc-if value="{{ f.dup }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;line-height:1.5;color:#e0b86a;margin-top:7px;display:flex;align-items:center;gap:6px"><span>⚠</span>“{{ f.dupName }}” is already in your backlog.</div></sc-if>
              </sc-if>
              <sc-if value="{{ f.isLongtext }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b938d);font-weight:600;margin-bottom:7px">{{ f.label }}</div>
                <textarea value="{{ f.value }}" onInput="{{ f.onInput }}" aria-label="{{ f.label }}" placeholder="{{ f.placeholder }}" style="width:100%;min-height:88px;resize:vertical;background:var(--inset,#0f110f);border:1px solid var(--wh);border-radius:9px;padding:10px 12px;color:var(--text,#e8ebe8);font-size:13.5px;line-height:1.55"></textarea>
              </sc-if>
              <sc-if value="{{ f.isTags }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b938d);font-weight:600;margin-bottom:7px">{{ f.label }}</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
                  <sc-for list="{{ f.chips }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.onRemove }}" aria-label="{{ t.removeLabel }}" style="font:inherit;font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;color:var(--accent,#9ce6b0);background:color-mix(in srgb, var(--accent) 13%, transparent);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);display:flex;align-items:center;gap:6px">{{ t.tag }} <span aria-hidden="true" style="font-size:13px;line-height:1">×</span></button></sc-for>
                </div>
                <input value="{{ f.tagInput }}" onInput="{{ f.onTagInput }}" onKeyDown="{{ f.onTagKey }}" aria-label="{{ f.label }} — add a tag" autocomplete="off" spellcheck="false" placeholder="Type a tag, press Enter…" style="width:100%;background:var(--inset,#0f110f);border:1px solid var(--wh);border-radius:9px;padding:9px 12px;color:var(--text,#e8ebe8);font-size:13px"/>
                <sc-if value="{{ f.hasSuggest }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">
                    <sc-for list="{{ f.suggest }}" as="t" hint-placeholder-count="6"><button onClick="{{ t.onAdd }}" aria-label="{{ t.addLabel }}" style="font:inherit;font-size:11.5px;padding:4px 10px;border-radius:20px;cursor:pointer;color:var(--muted2,#9aa39c);background:var(--chip,#20241f);border:1px solid var(--wd)">+ {{ t.tag }}</button></sc-for>
                  </div>
                </sc-if>
              </sc-if>
              <sc-if value="{{ f.isChips }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b938d);font-weight:600;margin-bottom:7px">{{ f.label }}</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px">
                  <sc-for list="{{ f.chips }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.onClick }}" aria-pressed="{{ c.pressed }}" style="font:inherit;flex:1;min-width:74px;text-align:center;font-size:13px;font-weight:500;padding:9px 6px;border-radius:9px;cursor:pointer;color:{{ c.color }};background:{{ c.bg }};border:1px solid {{ c.border }}">{{ c.label }}</button></sc-for>
                </div>
              </sc-if>
              <sc-if value="{{ f.isCombo }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b938d);font-weight:600;margin-bottom:7px">{{ f.label }}</div>
                <input value="{{ f.value }}" onInput="{{ f.onInput }}" aria-label="{{ f.label }}" autocomplete="off" spellcheck="false" placeholder="{{ f.placeholder }}" style="width:100%;background:var(--inset,#0f110f);border:1px solid var(--wh);border-radius:9px;padding:10px 12px;color:var(--text,#e8ebe8);font-size:14px"/>
                <sc-if value="{{ f.hasSuggest }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">
                    <sc-for list="{{ f.suggest }}" as="s" hint-placeholder-count="6"><button onClick="{{ s.onClick }}" style="font:inherit;font-size:11.5px;padding:4px 10px;border-radius:20px;cursor:pointer;color:var(--muted2,#9aa39c);background:var(--chip,#20241f);border:1px solid var(--wd)">{{ s.label }}</button></sc-for>
                  </div>
                </sc-if>
              </sc-if>
              <sc-if value="{{ f.isToggle }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ f.onToggle }}" role="switch" aria-checked="{{ f.checked }}" style="font:inherit;display:flex;align-items:center;gap:9px;cursor:pointer;padding:2px 4px;background:none;border:none;color:inherit">
                  <span aria-hidden="true" style="width:38px;height:22px;border-radius:12px;background:{{ f.trackBg }};position:relative;transition:background .2s;flex:none"><span style="position:absolute;top:2px;left:{{ f.knobLeft }};width:18px;height:18px;border-radius:50%;background:var(--text,#e8ebe8);transition:left .2s"></span></span>
                  <span style="font-size:13px;color:var(--text2,#c8d6cb)">{{ f.label }}</span>
                </button>
              </sc-if>
            </div>
          </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--wd)">
      <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onDeleteModal }}" style="font-size:13px;font-weight:600;color:{{ mDelColor }};background:{{ mDelBg }};border:1px solid {{ mDelBorder }};border-radius:9px;padding:9px 16px;cursor:pointer">{{ mDelLabel }}</button>
      </sc-if>
      <sc-if value="{{ isAdd }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
      <div style="display:flex;gap:9px">
        <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ onShareFromModal }}" style="font-size:13px;font-weight:600;color:var(--text2,#c8d6cb);background:var(--chip,#20241f);border:1px solid var(--wf);border-radius:9px;padding:9px 16px;cursor:pointer">Share</button>
        </sc-if>
        <button onClick="{{ closeModal }}" style="font-size:13px;font-weight:600;color:var(--text2,#c8d6cb);background:var(--chip,#20241f);border:1px solid var(--wf);border-radius:9px;padding:9px 18px;cursor:pointer">Cancel</button>
        <button onClick="{{ onSave }}" style="font-size:13px;font-weight:700;color:var(--onAccent,#0d0f0e);background:var(--accent,#9ce6b0);border:none;border-radius:9px;padding:9px 22px;cursor:pointer;opacity:{{ saveOpacity }}">{{ saveLabel }}</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:760},&quot;d&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}">
class Component extends DCLogic {
  // Presentational only — the collection builds fields via CollectionLib.buildModal.
  dialog = React.createRef();

  componentDidMount() {
    this.prevFocus = document.activeElement;
    this.onKey = (e) => {
      const d = this.props.d || {};
      if (e.key === 'Escape') { e.stopPropagation(); d.closeModal && d.closeModal(); return; }
      if (e.key !== 'Tab') return;
      const root = this.dialog.current; if (!root) return;
      const f = [...root.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', this.onKey, true);
    setTimeout(() => {
      const root = this.dialog.current; if (!root) return;
      const el = root.querySelector('input,textarea,button');
      el && el.focus();
    }, 30);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey, true);
    if (this.prevFocus && this.prevFocus.focus) this.prevFocus.focus();
  }

  renderVals() { return { ...(this.props.d || {}), dialogRef: this.dialog }; }
}
</script>
</body>
</html>
