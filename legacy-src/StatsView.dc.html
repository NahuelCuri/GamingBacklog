<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding-top:22px;animation:gfade .2s ease">
  <!-- export bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <div style="font-size:12.5px;color:var(--muted,#8b938d)">Build a shareable image from any of your stats.</div>
    <button onClick="{{ openExport }}" style="font-size:13px;font-weight:700;color:var(--onAccent,#0d0f0e);background:var(--accent,#9ce6b0);border:none;border-radius:9px;padding:9px 16px;cursor:pointer">Create image ↗</button>
  </div>

  <!-- summary cards -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:26px">
    <sc-for list="{{ summary }}" as="c" hint-placeholder-count="6">
      <div style="background:var(--card,#141614);border:1px solid var(--wd);border-radius:12px;padding:16px 17px;min-width:0">
        <div style="font-family:'JetBrains Mono',monospace;font-size:{{ c.size }};font-weight:600;color:{{ c.color }};letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.value }}</div>
        <div style="font-size:11.5px;color:var(--muted,#8b938d);margin-top:4px">{{ c.label }}</div>
      </div>
    </sc-for>
  </div>

  <div style="display:grid;grid-template-columns:{{ statsGridCols }};gap:20px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:20px">
      <sc-for list="{{ left }}" as="w" hint-placeholder-count="4">
        <dc-import name="StatWidget" w="{{ w }}" hint-size="100%,220px"></dc-import>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <sc-for list="{{ right }}" as="w" hint-placeholder-count="5">
        <dc-import name="StatWidget" w="{{ w }}" hint-size="100%,220px"></dc-import>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:760},&quot;d&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}">
class Component extends DCLogic {
  // Presentational only — all widget data comes in as `d` from the owning collection.
  renderVals() { return this.props.d || {}; }
}
</script>
</body>
</html>
