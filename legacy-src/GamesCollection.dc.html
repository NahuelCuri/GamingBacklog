<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0d0f0e">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0d0f0e"/>
    <rect x="360" y="250" width="480" height="90" rx="16" fill="#181b19" stroke="#2a302c" stroke-width="2"/>
    <circle cx="470" cy="295" r="26" fill="#9ce6b0"/>
    <rect x="520" y="278" width="240" height="16" rx="8" fill="#c8d6cb"/>
    <rect x="520" y="306" width="140" height="12" rx="6" fill="#59605b"/>
    <rect x="360" y="370" width="480" height="70" rx="14" fill="#121412" stroke="#20241f" stroke-width="2"/>
    <rect x="360" y="460" width="480" height="70" rx="14" fill="#121412" stroke="#20241f" stroke-width="2"/>
    <text x="600" y="620" font-family="monospace" font-size="34" fill="#9ce6b0" text-anchor="middle">// gaaems backlog</text>
  </svg>
</template>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg,#0d0f0e)}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--text,#e8ebe8)}
  a{color:var(--accent,#9ce6b0);text-decoration:none}
  a:hover{color:var(--accent2,#c2e6cd)}
  input,textarea,select,button{font-family:inherit}
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent,#9ce6b0);outline-offset:1px;border-color:var(--accent,#9ce6b0)!important}
  :focus-visible{outline:2px solid var(--accent,#9ce6b0);outline-offset:2px}
  button,[role=button],[role=tab],a,label,summary,input,select,textarea{touch-action:manipulation}
  ::placeholder{color:var(--dim,#59605b)}
  ::selection{background:color-mix(in srgb, var(--accent) 25%, transparent)}
  input[type=date]::-webkit-calendar-picker-indicator{filter:var(--dateInvert,invert(.7))}
  .g-scroll::-webkit-scrollbar{width:10px;height:10px}
  .g-scroll::-webkit-scrollbar-thumb{background:#2a302c;border-radius:6px;border:2px solid var(--bg,#0d0f0e)}
  @keyframes gfade{from{opacity:0}to{opacity:1}}
  @keyframes gpop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  @keyframes gpulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
  @keyframes gpulsebtn{0%,100%{opacity:.55;box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent)}50%{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</helmet>

<div style="--accent:{{ accentVar }};--rowpad:{{ rowPadVar }};min-height:100dvh;background:var(--bg,#0d0f0e);color:var(--text,#e8ebe8)">

<sc-if value="{{ isAuthed }}" hint-placeholder-val="{{ true }}">
<div>

<!-- ===== TOP BAR ===== -->
<header style="position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg,#0d0f0e) 86%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--we)">
  <div style="max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:{{ topBarPad }};flex-wrap:wrap">
    <h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;text-wrap:balance">
      <button onClick="{{ onHome }}" title="All libraries" aria-label="All libraries" style="display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:none;padding:0;color:inherit;font:inherit">
        <span data-no-i18n translate="no">{{ brandName }}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;color:var(--dim,#59605b)">{{ kickerText }}</span>
      </button>
    </h1>
    <nav aria-label="Views" role="tablist" style="display:flex;gap:3px;background:var(--topchip,#151816);border:1px solid var(--wd);border-radius:9px;padding:3px;flex:{{ navGroupFlex }};order:{{ navGroupOrder }}">
      <button role="tab" aria-selected="{{ libTabSel }}" onClick="{{ goLibrary }}" style="flex:{{ navTabFlex }};text-align:{{ navTabAlign }};font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;color:{{ libTabColor }};background:{{ libTabBg }}">{{ libTabLabel }}</button>
      <button role="tab" aria-selected="{{ statsTabSel }}" onClick="{{ goStats }}" style="flex:{{ navTabFlex }};text-align:{{ navTabAlign }};font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;color:{{ statsTabColor }};background:{{ statsTabBg }}">Stats</button>
      <sc-if value="{{ hasMonths }}" hint-placeholder-val="{{ false }}">
      <button role="tab" aria-selected="{{ monthsTabSel }}" onClick="{{ goMonths }}" style="flex:{{ navTabFlex }};text-align:{{ navTabAlign }};font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;color:{{ monthsTabColor }};background:{{ monthsTabBg }}">Months</button>
      </sc-if>
      <sc-if value="{{ hasGeo }}" hint-placeholder-val="{{ false }}">
      <button role="tab" aria-selected="{{ mapTabSel }}" onClick="{{ goMap }}" style="flex:{{ navTabFlex }};text-align:{{ navTabAlign }};font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;color:{{ mapTabColor }};background:{{ mapTabBg }}">Map</button>
      </sc-if>
      <sc-if value="{{ hasRoulette }}" hint-placeholder-val="{{ true }}">
      <button role="tab" aria-selected="{{ rlTabSel }}" onClick="{{ goRoulette }}" style="flex:{{ navTabFlex }};text-align:{{ navTabAlign }};font-size:13px;font-weight:600;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;color:{{ rlTabColor }};background:{{ rlTabBg }}">Roulette</button>
      </sc-if>
    </nav>
    <div style="flex:{{ spacerFlex }}"></div>
    <sc-if value="{{ hasCurrency }}" hint-placeholder-val="{{ false }}">
    <div role="group" aria-label="Display currency (live rate)" style="display:flex;gap:2px;background:var(--topchip,#151816);border:1px solid var(--wd);border-radius:9px;padding:3px">
      <button onClick="{{ setUSD }}" aria-pressed="{{ usdSel }}" aria-label="Show amounts in US dollars" style="font-size:12px;font-weight:600;padding:6px 11px;border:none;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;color:{{ usdColor }};background:{{ usdBg }}">US$</button>
      <button onClick="{{ setARS }}" aria-pressed="{{ arsSel }}" aria-label="Show amounts in Argentine pesos" style="font-size:12px;font-weight:600;padding:6px 11px;border:none;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;color:{{ arsColor }};background:{{ arsBg }}">AR$</button>
    </div>
    </sc-if>
    <button onClick="{{ onExport }}" title="Export backup (JSON)" style="font:inherit;font-size:12px;color:var(--muted,#8b938d);cursor:pointer;padding:7px 10px;border-radius:7px;background:var(--topchip,#151816);border:1px solid var(--wd)">Export</button>
    <label title="Import JSON" style="font-size:12px;color:var(--muted,#8b938d);cursor:pointer;padding:7px 10px;border-radius:7px;background:var(--topchip,#151816);border:1px solid var(--wd)">Import<input type="file" accept="application/json" aria-label="Import backup JSON file" onChange="{{ onImport }}" style="position:absolute;width:1px;height:1px;opacity:0"></label>
    <button onClick="{{ openAdd }}" style="font-size:13px;font-weight:600;color:var(--onAccent,#0d0f0e);background:var(--accent,#9ce6b0);border:none;border-radius:9px;padding:9px 16px;cursor:pointer">{{ addBtnLabel }}</button>
    <div style="display:flex;align-items:center;gap:8px;margin-left:2px;padding-left:12px;border-left:1px solid var(--wf)">
      <button onClick="{{ onOpenSettings }}" title="Settings & admin" aria-label="Settings and admin" style="display:{{ emailFlex }};align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted,#8b938d);max-width:190px;cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--topchip,#151816);border:1px solid var(--wf);transition:color .2s,border-color .2s" style-hover="color:#e8ebe8;border-color:var(--accent,#9ce6b0)">
        <svg width="12.5" height="12.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="flex-shrink:0"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ userEmail }}</span>
      </button>
      <button onClick="{{ onSignOut }}" title="Sign out" style="font:inherit;font-size:12px;color:var(--muted,#8b938d);cursor:pointer;padding:7px 10px;border-radius:7px;background:var(--topchip,#151816);border:1px solid var(--wd)">Sign out</button>
    </div>
  </div>
</header>

<main style="max-width:1180px;margin:0 auto;padding:{{ containerPad }}">

<!-- ===================== LIBRARY VIEW ===================== -->
<sc-if value="{{ isLibrary }}" hint-placeholder-val="{{ true }}">
<div>
  <!-- stats strip -->
  <div style="display:flex;flex-wrap:wrap;gap:{{ statsStripGap }};padding:22px 4px 20px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums">
    <sc-for list="{{ stripItems }}" as="m" hint-placeholder-count="7">
      <div><span style="font-weight:600;color:{{ m.color }}">{{ m.value }}</span> <span style="color:var(--dim,#59605b)">{{ m.label }}</span></div>
    </sc-for>
  </div>

  <!-- toolbar -->
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <div style="flex:1;min-width:{{ searchMinWidth }};display:flex;align-items:center;gap:9px;background:var(--topchip,#151816);border:1px solid var(--wf);border-radius:9px;padding:9px 13px">
      <span aria-hidden="true" style="color:var(--dim,#59605b);font-size:14px">⌕</span>
      <input type="search" value="{{ q }}" onInput="{{ onSearch }}" aria-label="Search your library" autocomplete="off" spellcheck="false" placeholder="Search title, tag, platform, review…" style="flex:1;background:none;border:none;color:var(--text,#e8ebe8);font-size:13.5px;padding:0"/>
      <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clearSearch }}" aria-label="Clear search" style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:-4px -6px -4px 0;background:none;border:none;color:var(--dim,#59605b);cursor:pointer;font-size:15px;line-height:1">×</button></sc-if>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:3px;background:var(--topchip,#151816);border:1px solid var(--wd);border-radius:9px;padding:3px">
      <sc-for list="{{ statusChips }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.onClick }}" aria-pressed="{{ c.pressed }}" style="font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border:none;border-radius:6px;cursor:pointer;color:{{ c.color }};background:{{ c.bg }}">{{ c.label }}</button>
      </sc-for>
    </div>
    <button onClick="{{ resetSort }}" title="Reset sort order" aria-label="Reset sort order" style="font-size:15px;padding:8px 11px;border-radius:9px;cursor:pointer;color:{{ resetColor }};background:var(--topchip,#151816);border:1px solid var(--wd);line-height:1;opacity:{{ resetOpacity }}">↺</button>
    <div role="group" aria-label="Layout" style="display:flex;gap:3px;background:var(--topchip,#151816);border:1px solid var(--wd);border-radius:9px;padding:3px">
      <button onClick="{{ setTable }}" title="Table view" aria-label="Table view" aria-pressed="{{ tableSel }}" style="padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:13px;color:{{ tableColor }};background:{{ tableBg }}">▤</button>
      <button onClick="{{ setCards }}" title="Card view" aria-label="Card view" aria-pressed="{{ cardsSel }}" style="padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:13px;color:{{ cardsColor }};background:{{ cardsBg }}">▦</button>
    </div>
  </div>

  <div aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">{{ resultCountText }}</div>

  <!-- category pills (finance ledger) -->
  <sc-if value="{{ hasCatFilters }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px;background:var(--topchip,#151816);border:1px solid var(--wd);border-radius:9px;padding:3px;align-self:flex-start;width:fit-content">
      <sc-for list="{{ catChips }}" as="c" hint-placeholder-count="7"><button onClick="{{ c.onClick }}" aria-pressed="{{ c.pressed }}" style="font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border:none;border-radius:6px;cursor:pointer;color:{{ c.color }};background:{{ c.bg }}">{{ c.label }}</button></sc-for>
    </div>
  </sc-if>

  <!-- tag panel -->
  <sc-if value="{{ showTags }}" hint-placeholder-val="{{ false }}">
    <div style="background:var(--surface,#121412);border:1px solid var(--we);border-radius:11px;padding:14px 15px;margin-bottom:14px;animation:gfade .18s ease">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
        <span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim,#59605b);font-weight:600">Filter by tags · AND</span>
        <sc-if value="{{ hasTagFilters }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clearTags }}" style="font:inherit;font-size:11.5px;color:var(--accent,#9ce6b0);background:none;border:none;padding:0;cursor:pointer">clear all</button></sc-if>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ tagCloud }}" as="t" hint-placeholder-count="12">
          <button onClick="{{ t.onClick }}" aria-pressed="{{ t.pressed }}" style="font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;cursor:pointer;color:{{ t.color }};background:{{ t.bg }};border:1px solid {{ t.border }}">{{ t.tag }} <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums">{{ t.count }}</span></button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- active filter chips -->
  <sc-if value="{{ hasTagFilters }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
      <sc-for list="{{ activeTags }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.onClick }}" aria-label="{{ t.removeLabel }}" style="font:inherit;font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;color:var(--accent,#9ce6b0);background:color-mix(in srgb, var(--accent) 13%, transparent);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);display:flex;align-items:center;gap:6px">{{ t.tag }} <span aria-hidden="true" style="font-size:13px;line-height:1">×</span></button>
      </sc-for>
    </div>
  </sc-if>

  <!-- ===== TABLE ===== -->
  <sc-if value="{{ isTable }}" hint-placeholder-val="{{ true }}">
  <dc-import name="ItemTable" d="{{ tableData }}" hint-size="100%,400px"></dc-import>
  </sc-if>

  <!-- ===== CARDS ===== -->
  <sc-if value="{{ isCards }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <div onClick="{{ r.onEdit }}" onKeyDown="{{ r.onKey }}" role="button" tabindex="0" aria-label="{{ r.editLabel }}" style="background:var(--card,#141614);border:1px solid {{ r.cardBorder }};border-radius:12px;padding:15px;cursor:pointer;box-shadow:{{ r.cardGlow }}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="font-weight:600;font-size:14.5px;letter-spacing:-.01em;line-height:1.3">{{ r.title }}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:{{ r.scoreColor }};flex:none;font-variant-numeric:tabular-nums">{{ r.scoreDisp }}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">
            <sc-for list="{{ r.tagChips }}" as="tc" hint-placeholder-count="2"><span style="font-size:10.5px;color:var(--muted2,#9aa39c);background:var(--chip,#20241f);border-radius:5px;padding:2px 7px">{{ tc.tag }}</span></sc-for>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px">
            <span style="width:6px;height:6px;border-radius:50%;background:{{ r.statusDot }};box-shadow:{{ r.statusGlow }}"></span>
            <span style="color:{{ r.statusText }}">{{ r.statusLabel }}</span>
            <span style="flex:1"></span>
            <span style="font-family:'JetBrains Mono',monospace;color:var(--muted,#8b938d);font-variant-numeric:tabular-nums">{{ r.hoursDisp }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <!-- empty -->
  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <sc-if value="{{ isFresh }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;padding:70px 20px">
        <div style="font-size:17px;font-weight:600;color:var(--text2,#c8d6cb);margin-bottom:8px">{{ emptyTitleText }}</div>
        <div style="font-size:13px;color:var(--dim,#59605b);margin-bottom:22px">{{ emptySubText }}</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button onClick="{{ openAdd }}" style="font-size:13px;font-weight:700;color:var(--onAccent,#0d0f0e);background:var(--accent,#9ce6b0);border:none;border-radius:9px;padding:10px 18px;cursor:pointer">{{ addOneLabel }}</button>
          <button onClick="{{ loadStarter }}" style="font-size:13px;font-weight:600;color:var(--muted,#8b938d);background:var(--topchip,#151816);border:1px solid var(--wf);border-radius:9px;padding:10px 18px;cursor:pointer">Load starter set</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isFiltered }}" hint-placeholder-val="{{ true }}">
      <div style="text-align:center;padding:70px 20px;color:var(--dim,#59605b)">
        <div style="font-size:15px;margin-bottom:6px">{{ noMatchText }}</div>
        <div style="font-size:13px">Try clearing filters or <button onClick="{{ openAdd }}" style="font:inherit;color:var(--accent,#9ce6b0);background:none;border:none;padding:0;cursor:pointer">{{ addNewLabel }}</button>.</div>
      </div>
    </sc-if>
  </sc-if>
</div>
</sc-if>

<!-- ===================== STATS VIEW ===================== -->
<sc-if value="{{ isStats }}" hint-placeholder-val="{{ false }}">
<dc-import name="StatsView" d="{{ statsData }}" hint-size="100%,600px"></dc-import>
</sc-if>

<!-- ===================== MONTHS VIEW ===================== -->
<sc-if value="{{ isMonths }}" hint-placeholder-val="{{ false }}">
<dc-import name="MonthsView" d="{{ monthsData }}" hint-size="100%,600px"></dc-import>
</sc-if>

<!-- ===================== MAP VIEW ===================== -->
<sc-if value="{{ isMap }}" hint-placeholder-val="{{ false }}">
<dc-import name="GeoMap" d="{{ geoData }}" hint-size="100%,640px"></dc-import>
</sc-if>

<!-- ===================== ROULETTE VIEW ===================== -->
<sc-if value="{{ isRoulette }}" hint-placeholder-val="{{ false }}">
<dc-import name="Roulette" d="{{ rouletteData }}" hint-size="100%,600px"></dc-import>
</sc-if>

</main>

<!-- ===================== MODAL ===================== -->
<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
<dc-import name="ItemModal" d="{{ modalData }}" hint-size="100%,100%"></dc-import>
</sc-if>

<!-- ===================== STATS IMAGE EXPORT ===================== -->
<sc-if value="{{ exportOpen }}" hint-placeholder-val="{{ false }}">
<dc-import name="ShareImage" d="{{ shareData }}" hint-size="100%,100%"></dc-import>
</sc-if>

<!-- ===================== PER-ITEM SHARE CARD ===================== -->
<sc-if value="{{ shareCardOpen }}" hint-placeholder-val="{{ false }}">
<dc-import name="ShareCard" d="{{ shareCardData }}" hint-size="100%,100%"></dc-import>
</sc-if>

<!-- ===================== LIBRARY SWITCHER FAB ===================== -->
<div style="position:fixed;right:max(env(safe-area-inset-right,0px),22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:300;display:flex;flex-direction:column-reverse;align-items:center;gap:12px">
  <button onClick="{{ toggleFab }}" title="Switch library" aria-label="Switch library" aria-expanded="{{ fabExpanded }}" style="{{ fabMainStyle }}">{{ fabMainIcon }}</button>
  <sc-for list="{{ fabItems }}" as="it" hint-placeholder-count="0">
    <button onClick="{{ it.onClick }}" title="{{ it.label }}" aria-label="{{ it.label }}" style="{{ it.style }}">{{ it.icon }}</button>
  </sc-for>
</div>

</div>
</sc-if>

</div>
</x-dc>
